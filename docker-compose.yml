version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: evehicle-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - evehicle-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evehicle-api
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EVehicleDB;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - evehicle-network
    volumes:
      - ./src:/app/src
      - ./EVehicle.sln:/app/EVehicle.sln
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped

  api-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evehicle-api-prod
    ports:
      - "9290:9290"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:9290
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=EVehicleDB;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - evehicle-network
    dns:
      - 8.8.8.8
      - 8.8.4.4
    restart: unless-stopped
    profiles:
      - production


networks:
  evehicle-network:
    driver: bridge

volumes:
  sqlserver-data:

