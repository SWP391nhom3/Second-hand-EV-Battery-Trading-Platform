name: Compatibility Check

on:
  pull_request:
    branches: [ main, feature/* ]
  push:
    branches: [ main, feature/* ]

jobs:
  compatibility-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Run Compatibility Checker
      run: |
        chmod +x check-compatibility.sh
        ./check-compatibility.sh
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18.x'
    
    - name: Test Backend Build
      run: |
        cd EVehicleManagementAPI/EVehicleManagementAPI
        dotnet restore
        dotnet build --no-incremental
    
    - name: Check Frontend Structure
      run: |
        if [ -d "Second-hand-EV-Battery-Trading-Platform-FE" ]; then
          cd Second-hand-EV-Battery-Trading-Platform-FE
          if [ -f "package.json" ]; then
            echo "✅ Frontend package.json exists"
          else
            echo "⚠️ Frontend package.json not found"
            exit 1
          fi
          
          if [ -f ".env.example" ]; then
            echo "✅ .env.example exists"
          else
            echo "⚠️ .env.example not found"
            exit 1
          fi
        fi
    
    - name: Verify Configuration Files
      run: |
        # Check example files exist
        if [ ! -f "EVehicleManagementAPI/EVehicleManagementAPI/appsettings.example.json" ]; then
          echo "❌ appsettings.example.json not found"
          exit 1
        fi
        
        # Verify sensitive files are not committed
        if git ls-files | grep -q "EVehicleManagementAPI/EVehicleManagementAPI/appsettings.json$"; then
          echo "❌ appsettings.json should not be committed"
          exit 1
        fi
        
        echo "✅ Configuration files verified"

